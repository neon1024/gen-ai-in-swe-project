spring.application.name=backend
spring.config.import=classpath:event-authoring.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ubb_events}
spring.datasource.username=${DB_USERNAME:ubb}
spring.datasource.password=${DB_PASSWORD:ubb}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/migration/auth,classpath:db/migration/eventlifecycle
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:no-reply@localhost}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
