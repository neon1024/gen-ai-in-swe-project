spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ubb_events}
spring.datasource.username=${DB_USERNAME:ubb}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.config.import=classpath:event-authoring.properties

# EMAIL SERVICE - RESEND
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

app.frontend-url=http://localhost:5173
