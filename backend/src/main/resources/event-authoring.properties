spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Shared by main and test properties. app.flyway.demo-location (",classpath:db/demo") adds the local
# demo accounts; it is set only by scripts/run-app.sh and the tests, never by default.
spring.flyway.locations=classpath:db/migration,classpath:db/migration/auth,classpath:db/migration/eventlifecycle,classpath:db/migration/organizations${app.flyway.demo-location:}
